services:
  mariadb:
    container_name: mariadb
    build: ./srcs/requirements/mariadb
    env_file: .env
    volumes:
      - /home/tcali/data/mariadb:/var/lib/mysql
    restart: always
    expose:
      - "3306"
    networks:
      - inception

  wordpress:
    container_name: wordpress
    env_file: .env
    volumes:
      - /home/tcali/data/wordpress:/var/www/wordpress
    build: ./srcs/requirements/wordpress
    depends_on:
      - mariadb
    restart: always
    expose:
      - "9000"
    networks:
      - inception

  nginx:
    container_name: nginx
    volumes:
      - /home/tcali/data/wordpress:/var/www/wordpress
    depends_on:
      - wordpress
    build: ./srcs/requirements/nginx
    env_file: .env
    restart: always
    ports:
      - "443:443"
      - "80:80"
    networks:
      - inception

networks:
  inception:
    driver: bridge
