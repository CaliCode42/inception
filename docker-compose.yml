services:
  mariadb:
    container_name: mariadb
    build: ./srcs/requirements/mariadb
    env_file: .env
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always
    expose:
      - "3306"
    networks:
      - inception

  wordpress:
    container_name: wordpress
    build: ./srcs/requirements/wordpress
    env_file: .env
    volumes:
      - wordpress_data:/var/www/wordpress
    depends_on:
      - mariadb
    restart: always
    expose:
      - "9000"
    networks:
      - inception

  nginx:
    container_name: nginx
    build: ./srcs/requirements/nginx
    env_file: .env
    volumes:
      - wordpress_data:/var/www/wordpress
    depends_on:
      - wordpress
    restart: always
    ports:
      - "443:443"
      - "80:80"
    networks:
      - inception

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/tcali/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/tcali/data/wordpress